[project]
name = "rotascale"
version = "0.1.0"
description = "Rotascale SDK — govern what your agents are allowed to do, and prove what they did"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
mcp = []          # duck-typed; no mcp dependency needed

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotascale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


# subhadipmitra@: The SDK inherited these from the platform repository's root
# pyproject and lost them in the split — CI failed on the first run for that
# reason alone. Duplicated rather than shared: a client that has to be checked
# out alongside the platform to lint is not independently releasable, which was
# the whole point of moving it.
#
# Kept deliberately identical to the platform's, so a contributor moving
# between the two does not meet different rules.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["rotascale"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
