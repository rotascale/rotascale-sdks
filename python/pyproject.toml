[project]
name = "rotascale"
# subhadipmitra@: The ONLY place the version is written. `_version.py` reads it
# back from installed metadata, because it used to live here, in __init__.py and
# in a hardcoded user-agent, and two of those were stale.
#
# 0.2.0 supersedes the 0.1.1 on PyPI, which was the SDK for the retired
# Trust Intelligence Platform — a different product under the same name. PyPI
# never allows a version to be replaced, so superseding is the only "overwrite"
# there is.
version = "0.2.0"
description = "Govern what your agents are allowed to do, and prove what they did"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rota, Inc.", email = "dev@rotascale.com" }]
keywords = [
    "agent", "governance", "ai-governance", "authorization", "audit",
    "evidence", "compliance", "llm", "mcp", "observability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://rotascale.com"
Source = "https://github.com/rotascale/rotascale-sdks"
Issues = "https://github.com/rotascale/rotascale-console/issues"

[project.optional-dependencies]
mcp = []          # duck-typed; no mcp dependency needed

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotascale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


# subhadipmitra@: The SDK inherited these from the platform repository's root
# pyproject and lost them in the split — CI failed on the first run for that
# reason alone. Duplicated rather than shared: a client that has to be checked
# out alongside the platform to lint is not independently releasable, which was
# the whole point of moving it.
#
# Kept deliberately identical to the platform's, so a contributor moving
# between the two does not meet different rules.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.isort]
known-first-party = ["rotascale"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
