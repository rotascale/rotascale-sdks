[project]
name = "rotascale"
version = "0.1.0"
description = "Rotascale SDK — govern what your agents are allowed to do, and prove what they did"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
]

[project.optional-dependencies]
mcp = []          # duck-typed; no mcp dependency needed

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotascale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
