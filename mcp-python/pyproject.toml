[project]
name = "rotascale-mcp"
version = "0.1.0"
description = "Govern any agent that speaks the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rota, Inc.", email = "dev@rotascale.com" }]
keywords = ["mcp", "model-context-protocol", "agent", "governance", "authorization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
# subhadipmitra@: A separate distribution from `rotascale` on purpose. This one
# carries an MCP dependency that has no business in a plain SDK install, and the
# MCP spec revises on its own schedule — pinning them together would force
# pointless releases of one to keep up with the other.
dependencies = [
    "rotascale>=0.2.0",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://rotascale.com"
Source = "https://github.com/rotascale/rotascale-sdks"
Issues = "https://github.com/rotascale/rotascale-console/issues"

[project.scripts]
rotascale-mcp = "rotascale_mcp.__main__:main"
rotascale-mcp-proxy = "rotascale_mcp.proxy_main:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotascale_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
