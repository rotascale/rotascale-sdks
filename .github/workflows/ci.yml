name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v5

      # subhadipmitra@: The CONSOLE's schema, which the contract test needs.
      #
      # `test/contract.test.ts` validates the request body against the API's
      # committed `openapi.json` and skips when it is absent. That skip is
      # honest locally and would be a lie here: without it, the one test that
      # catches a body the API would reject never runs — the `#149` shape,
      # coverage that looks like coverage.
      #
      # Not `continue-on-error`. If the schema cannot be fetched this job
      # fails, rather than passing over a check it did not make.
      - uses: actions/checkout@v5
        with:
          repository: rotascale/rotascale-console
          path: console-schema
          token: ${{ secrets.CONSOLE_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install
      - run: npm run typecheck
      - run: npm run test
        env:
          ROTASCALE_OPENAPI: ${{ github.workspace }}/console-schema/api/openapi.json
      - run: npm run build

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run --with ruff ruff check src/ tests/

      - name: Tests
        run: uv run --with pytest pytest -q

      # subhadipmitra@: The SDK carries no provider dependencies on purpose —
      # a governance client that drags in the OpenAI package would force a
      # version conflict on the customer it is meant to help. The middlewares
      # import lazily, so importing the client must work with nothing else
      # installed.
      - name: Import with no optional dependencies
        run: uv run --no-project --with . python -c "import rotascale; print(rotascale.__name__)"

  mcp:
    name: MCP package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-python

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run --with ruff ruff check src/ tests/

      - name: Tests
        run: uv run --with pytest --with pytest-asyncio pytest -q

      # subhadipmitra@: The console script is the entire delivery mechanism —
      # an MCP host launches `rotascale-mcp` and nothing else. If that entry
      # point is not wired, the package installs cleanly and is completely
      # unusable, and no import test would notice.
      - name: Entry point is wired
        run: |
          uv run --no-project --with . python -c "
          from importlib.metadata import entry_points
          eps = {e.name: e.value for e in entry_points(group='console_scripts')}
          assert eps.get('rotascale-mcp') == 'rotascale_mcp.__main__:main', eps
          print('rotascale-mcp ->', eps['rotascale-mcp'])"
