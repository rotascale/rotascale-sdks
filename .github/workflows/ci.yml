name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v5

      # subhadipmitra@: No cross-repo checkout. The contract test reads
      # `schema/api.json`, a VENDORED fragment of the console's committed
      # spec, so it runs here unconditionally.
      #
      # The first version checked the console out to get the real file, which
      # needs a credential for a private repo and failed with "Not Found". The
      # alternative — skipping the test when the schema is absent — is the
      # `#149` shape: coverage that looks like coverage. Vendoring costs one
      # committed file and a `schema:sync` script, and the test compares the
      # copy against the real spec for anybody who has both repos, which is
      # anybody changing the API.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm install
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run --with ruff ruff check src/ tests/

      - name: Tests
        run: uv run --with pytest pytest -q

      # subhadipmitra@: The SDK carries no provider dependencies on purpose —
      # a governance client that drags in the OpenAI package would force a
      # version conflict on the customer it is meant to help. The middlewares
      # import lazily, so importing the client must work with nothing else
      # installed.
      - name: Import with no optional dependencies
        run: uv run --no-project --with . python -c "import rotascale; print(rotascale.__name__)"

  mcp:
    name: MCP package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-python

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Lint
        run: uv run --with ruff ruff check src/ tests/

      - name: Tests
        run: uv run --with pytest --with pytest-asyncio pytest -q

      # subhadipmitra@: The console script is the entire delivery mechanism —
      # an MCP host launches `rotascale-mcp` and nothing else. If that entry
      # point is not wired, the package installs cleanly and is completely
      # unusable, and no import test would notice.
      - name: Entry point is wired
        run: |
          uv run --no-project --with . python -c "
          from importlib.metadata import entry_points
          eps = {e.name: e.value for e in entry_points(group='console_scripts')}
          assert eps.get('rotascale-mcp') == 'rotascale_mcp.__main__:main', eps
          print('rotascale-mcp ->', eps['rotascale-mcp'])"
